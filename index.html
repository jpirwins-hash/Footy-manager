<!DOCTYPE html>
<html>
<head>
  <title>Rangers FC Manager Pro</title>
  <style>
    body {
      font-family: Arial;
      background: #0b1a2b;
      color: white;
      text-align: center;
      margin: 0;
      padding: 20px;
    }

    button {
      padding: 10px 15px;
      margin: 5px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .blue { background: #1e90ff; color: white; }
    .green { background: #00c46a; color: white; }
    .red { background: #ff4d4d; color: white; }

    .box {
      background: #12263a;
      padding: 15px;
      margin-top: 15px;
      border-radius: 10px;
    }

    select {
      padding: 8px;
      border-radius: 6px;
    }
  </style>
</head>

<body>

<h1>⚽ Rangers FC Manager Pro</h1>
<p>Build Rangers into champions 🏆</p>

<div class="box">
  💰 Budget: £<span id="money">10</span>M
</div>

<div class="box">
  🎯 Tactics:
  <select id="tactic">
    <option value="attack">Attack</option>
    <option value="balanced" selected>Balanced</option>
    <option value="defend">Defensive</option>
  </select>
</div>

<button class="blue" onclick="playMatch()">Play Next Match</button>
<button class="green" onclick="buyPlayer()">Buy Player (£2M)</button>
<button class="red" onclick="resetGame()">Reset Season</button>

<div class="box" id="log">Start your Rangers career</div>

<div class="box" id="table"></div>

<script>
let money = 10;

let teams = [
  { name: "Rangers", attack: 84, defence: 82, points: 0, gf: 0, ga: 0 },
  { name: "Celtic", attack: 86, defence: 83, points: 0, gf: 0, ga: 0 },
  { name: "Aberdeen", attack: 76, defence: 74, points: 0, gf: 0, ga: 0 },
  { name: "Hearts", attack: 75, defence: 73, points: 0, gf: 0, ga: 0 }
];

let fixtureIndex = 0;
let fixtures = [];

function rand(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

// create fixtures
function createFixtures() {
  fixtures = [];
  for (let i = 0; i < teams.length; i++) {
    for (let j = i + 1; j < teams.length; j++) {
      fixtures.push([teams[i], teams[j]]);
      fixtures.push([teams[j], teams[i]]);
    }
  }
}
createFixtures();

function playMatch() {
  if (fixtureIndex >= fixtures.length) {
    document.getElementById("log").innerHTML = "Season finished!";
    updateTable();
    return;
  }

  let [home, away] = fixtures[fixtureIndex];
  let tactic = document.getElementById("tactic").value;

  let boost = tactic === "attack" ? 5 : tactic === "defend" ? -5 : 0;

  let homeScore =
    Math.max(0, Math.floor((home.attack + boost - away.defence) / 20) + rand(0, 2));

  let awayScore =
    Math.max(0, Math.floor((away.attack - home.defence) / 20) + rand(0, 2));

  home.gf += homeScore;
  home.ga += awayScore;
  away.gf += awayScore;
  away.ga += homeScore;

  if (homeScore > awayScore) home.points += 3;
  else if (awayScore > homeScore) away.points += 3;
  else {
    home.points += 1;
    away.points += 1;
  }

  document.getElementById("log").innerHTML =
    `⚽ ${home.name} ${homeScore} - ${awayScore} ${away.name}`;

  fixtureIndex++;

  updateTable();
}

function buyPlayer() {
  if (money < 2) {
    alert("Not enough money!");
    return;
  }

  money -= 2;

  let rangers = teams.find(t => t.name === "Rangers");
  rangers.attack += 1;

  document.getElementById("log").innerHTML =
    "💰 Signed new player! Rangers attack improved";

  updateMoney();
}

function updateMoney() {
  document.getElementById("money").innerText = money;
}

  let html = "<h3>📊 League Table</h3>";

  table.forEach((t, i) => {
    html += `
      <div>
