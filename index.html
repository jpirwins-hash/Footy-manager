<!DOCTYPE html>
<html>
<head>
  <title>Football Career Simulator</title>

  <style>
    body {
      font-family: Arial;
      background: #0b0f1a;
      color: white;
      text-align: center;
      padding: 20px;
    }

    .box {
      max-width: 1200px;
      margin: auto;
      background: #151b2d;
      padding: 20px;
      border-radius: 12px;
    }

    #game { display: none; }

    button {
      padding: 10px;
      margin: 5px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
    }

    .start { background: #00c853; }
    .train { background: #00c853; }
    .match { background: #ff9800; }
    .offer { background: #9c27b0; }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .panel {
      background: #1b2440;
      padding: 10px;
      border-radius: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      border: 1px solid #2a355f;
      padding: 6px;
    }

    th {
      background: #111a33;
    }

    #feed {
      background: #0b1024;
      padding: 10px;
      border-radius: 10px;
      min-height: 160px;
      text-align: left;
    }

    #offers {
      background: #111a33;
      padding: 10px;
      margin-top: 10px;
      border-radius: 10px;
    }
  </style>
</head>

<body>

<div class="box">

  <!-- INTRO -->
  <div id="intro">
    <h1>⚽ Football Career Simulator</h1>

    <input id="name" placeholder="Enter name">
    <br><br>

    <button class="start" onclick="startGame()">Start Career</button>
  </div>

  <!-- GAME -->
  <div id="game">

    <h2>👤 Player Hub</h2>

    <div class="grid">

      <div class="panel">
        <p><b>Name:</b> <span id="pname"></span></p>
        <p><b>Club:</b> <span id="club"></span></p>
        <p><b>Season:</b> <span id="season"></span> | Week: <span id="week"></span></p>
        <p><b>Fatigue:</b> <span id="fatigue"></span></p>
        <p><b>Form:</b> <span id="form"></span></p>
      </div>

      <div class="panel">
        <p><b>Pace:</b> <span id="pace"></span></p>
        <p><b>Shooting:</b> <span id="shoot"></span></p>
        <p><b>Passing:</b> <span id="pass"></span></p>
        <p><b>Fitness:</b> <span id="fit"></span></p>

        <button class="train" onclick="train()">Train</button>
        <button class="match" onclick="playMatch()">Play Match</button>
      </div>

    </div>

    <h3>📩 Job Offers</h3>
    <div id="offers"></div>

    <h3>📺 Match Feed</h3>
    <div id="feed"></div>

    <h3>🏆 League Table</h3>
    <table>
      <thead>
        <tr>
          <th>Club</th>
          <th>P</th>
          <th>W</th>
          <th>L</th>
          <th>Pts</th>
        </tr>
      </thead>
      <tbody id="table"></tbody>
    </table>

  </div>

</div>

<script>

/* ---------------- STATE ---------------- */

let game = {
  name: "",
  club: "Manchester United",

  season: 1,
  week: 1,

  fatigue: 100,
  form: 0,

  offers: [],

  stats: {
    pace: 40,
    shoot: 40,
    pass: 40,
    fit: 50
  },

  teams: []
};

/* ---------------- LEAGUE ---------------- */

function createTeam(n) {
  return { name:n, p:0, w:0, l:0, pts:0 };
}

function initLeague() {
  game.teams = [
    createTeam("Manchester City"),
    createTeam("Arsenal"),
    createTeam("Liverpool"),
    createTeam("Chelsea"),
    createTeam("Manchester United"),
    createTeam("Tottenham"),
    createTeam("Newcastle"),
    createTeam("Aston Villa")
  ];
}

/* ---------------- START ---------------- */

function startGame() {

  game.name = document.getElementById("name").value;
  if (!game.name) return alert("Enter name");

  initLeague();

  document.getElementById("intro").style.display = "none";
  document.getElementById("game").style.display = "block";

  updateUI();
}

/* ---------------- TRAIN ---------------- */

function train() {

  let stat = ["pace","shoot","pass","fit"][Math.random()*4|0];

  game.stats[stat] += 1 + Math.random()*2;

  game.fatigue -= 10;
  if (game.fatigue < 0) game.fatigue = 0;

  addFeed("🏋️ Training improved " + stat);

  updateUI();
}

/* ---------------- MATCH ---------------- */

function playMatch() {

  let opp = game.teams[Math.random()*game.teams.length|0];

  let power =
    game.stats.pace +
    game.stats.shoot +
    game.stats.pass +
    game.stats.fit +
    game.form -
    (game.fatigue < 40 ? 15 : 0);

  let oppPower = 150 + Math.random()*90;

  let you = 0;
  let them = 0;

  let feed = ["⚽ vs " + opp.name];

  for (let i=0;i<6;i++) {

    let roll = Math.random()*100;

    if (roll < power/5) {
      you++;
      feed.push("🔥 GOAL YOU");
    }

    if (roll < oppPower/6) {
      them++;
      feed.push("💥 GOAL THEM");
    }
  }

  if (you > them) {
    game.form += 2;
    opp.l++; opp.pts += 0;
    feed.push("🏆 WIN " + you + "-" + them);
  } else {
    game.form -= 2;
    opp.w++; opp.pts += 3;
    feed.push("😓 LOSS " + you + "-" + them);
  }

  game.fatigue -= 15;
  if (game.fatigue < 0) game.fatigue = 0;

  game.week++;

  generateOffers();

  if (game.week > 10) endSeason();

  document.getElementById("feed").innerHTML = feed.map(f=>"<p>"+f+"</p>").join("");

  updateUI();
}

/* ---------------- SEASON ---------------- */

function endSeason() {

  let champ = [...game.teams].sort((a,b)=>b.pts-a.pts)[0];

  addFeed("🏆 SEASON END - CHAMPION: " + champ.name);

  game.season++;
  game.week = 1;

  game.teams.forEach(t=>{
    t.p=0;t.w=0;t.l=0;t.pts=0;
  });
}

/* ---------------- JOB OFFERS ---------------- */

function generateOffers() {

  if (Math.random() > 0.6) {

    let clubs = [
      { name:"Arsenal", rep:20, wage:200 },
      { name:"Liverpool", rep:25, wage:250 },
      { name:"Chelsea", rep:30, wage:300 },
      { name:"Man City", rep:40, wage:500 },
      { name:"Real Madrid", rep:45, wage:600 },
      { name:"Bayern Munich", rep:40, wage:480 }
    ];

    let offer = clubs[Math.random()*clubs.length|0];

    if (game.form > -5) {
      game.offers.push(offer);
    }

    showOffers();
  }
}

function showOffers() {

  let html = "";

  if (game.offers.length === 0) {
    html = "<p>No offers</p>";
  }

  game.offers.forEach((o,i)=>{
    html += `
      <p>${o.name} - £${o.wage}
      <button onclick="accept(${i})">Accept</button></p>
    `;
  });

  document.getElementById("offers").innerHTML = html;
}

function accept(i) {

  let o = game.offers[i];

  game.club = o.name;

  game.offers = [];

  addFeed("✍️ Signed for " + o.name);

  updateUI();
}

/* ---------------- FEED ---------------- */

function addFeed(t) {
  document.getElementById("feed").innerHTML =
    "<p>"+t+"</p>" + document.getElementById("feed").innerHTML;
}

/* ---------------- UI ---------------- */

function updateUI() {

  document.getElementById("pname").innerText = game.name;
  document.getElementById("club").innerText = game.club;
  document.getElementById("season").innerText = game.season;
  document.getElementById("week").innerText = game.week;

  document.getElementById("fatigue").innerText = game.fatigue;
  document.getElementById("form").innerText = game.form;

  document.getElementById("pace").innerText = game.stats.pace.toFixed(1);
  document.getElementById("shoot").innerText = game.stats.shoot.toFixed(1);
  document.getElementById("pass").innerText = game.stats.pass.toFixed(1);
  document.getElementById("fit").innerText = game.stats.fit.toFixed(1);

  let table = "";

  game.teams.forEach(t=>{
    table += `
      <tr>
        <td>${t.name}</td>
        <td>${t.p}</td>
        <td>${t.w}</td>
        <td>${t.l}</td>
        <td>${t.pts}</td>
      </tr>
    `;
  });

  document.getElementById("table").innerHTML = table;
}

</script>

</body>
</html>
