<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Football Career Mode</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React + ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body class="bg-black">
  <div id="root"></div>

  <script type="text/babel">

    function FootballCareerMode() {

      const league = [
        { pos: 1, club: "Manchester United", pts: 82, w: 26, d: 4, l: 3, gd: 48 },
        { pos: 2, club: "Manchester City", pts: 79, w: 25, d: 4, l: 4, gd: 42 },
        { pos: 3, club: "Arsenal", pts: 74, w: 22, d: 8, l: 3, gd: 34 },
        { pos: 4, club: "Liverpool", pts: 71, w: 21, d: 8, l: 4, gd: 30 },
        { pos: 5, club: "Chelsea", pts: 65, w: 19, d: 8, l: 6, gd: 18 },
      ];

      const fixtures = [
        { home: "Manchester United", away: "Liverpool", competition: "Premier League", stadium: "Old Trafford", date: "Sun 19 Apr" },
        { home: "Manchester United", away: "Real Madrid", competition: "Champions League", stadium: "Bernabeu", date: "Wed 22 Apr" },
        { home: "Manchester City", away: "Manchester United", competition: "FA Cup", stadium: "Wembley", date: "Sat 25 Apr" },
      ];

      const training = [
        { title: "Finishing Drills", desc: "Improve shooting and attacking movement.", stat: "+2 SHO" },
        { title: "Sprint Work", desc: "Increase pace and acceleration.", stat: "+2 PAC" },
        { title: "Playmaker Sessions", desc: "Boost passing and vision.", stat: "+2 PAS" },
        { title: "Recovery & Fitness", desc: "Recover stamina.", stat: "+FIT" },
      ];

      return (
        <div className="min-h-screen text-white p-6">

          <h1 className="text-4xl font-black mb-6 text-green-400">
            CAREER MODE
          </h1>

          {/* FIXTURES */}
          <div className="mb-8">
            <h2 className="text-2xl font-bold mb-3">Fixtures</h2>
            {fixtures.map((f, i) => (
              <div key={i} className="bg-slate-900 p-4 rounded-xl mb-3">
                {f.home} vs {f.away} - {f.date}
              </div>
            ))}
          </div>

          {/* TRAINING */}
          <div className="mb-8">
            <h2 className="text-2xl font-bold mb-3">Training</h2>
            {training.map((t, i) => (
              <div key={i} className="bg-slate-900 p-4 rounded-xl mb-3">
                <b>{t.title}</b> - {t.stat}
                <p className="text-slate-400">{t.desc}</p>
              </div>
            ))}
          </div>

          {/* LEAGUE */}
          <div>
            <h2 className="text-2xl font-bold mb-3">League</h2>
            {league.map((l) => (
              <div key={l.pos} className="bg-slate-900 p-3 rounded-xl mb-2">
                #{l.pos} {l.club} - {l.pts} pts
              </div>
            ))}
          </div>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root"))
      .render(<FootballCareerMode />);

  </script>
</body>
</html>
