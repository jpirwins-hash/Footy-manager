<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Football Career Mode - AAA+</title>
<style>
body{margin:0;font-family:Arial;background:#070b14;color:white}
header{padding:18px;background:linear-gradient(90deg,#16a34a,#0ea5e9)}
h1{margin:0;font-size:26px}
.container{padding:14px;display:grid;gap:14px}
.card{background:#111827;border:1px solid #1f2937;border-radius:14px;padding:14px}
button{background:#16a34a;color:white;border:none;padding:10px;border-radius:8px;cursor:pointer;margin-top:6px}
button:hover{background:#22c55e}
.flex{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.small{font-size:12px;color:#9ca3af}
.stat{font-size:18px;font-weight:bold}
.table{width:100%;border-collapse:collapse}
.table td,.table th{border-bottom:1px solid #1f2937;padding:8px}
.pitch{height:160px;background:linear-gradient(90deg,#0f5132,#14532d);border-radius:12px;position:relative;overflow:hidden}
.ball{width:18px;height:18px;border-radius:50%;background:white;position:absolute;top:70px;left:10px;transition:all 0.7s linear}
.commentary{font-size:12px;color:#d1d5db;margin-top:8px;height:90px;overflow:auto}
.badge{background:#1f2937;padding:3px 8px;border-radius:999px;font-size:11px}
</style>
</head>
<body><header>
<h1>⚽ AAA+ Career Mode</h1>
<div class="small">Full Career + Season + Live Match Engine</div>
</header><div class="container"><!-- PLAYER --><div class="card">
<h2>JP IRWIN</h2>
<div class="flex">
<div>OVR <div class="stat" id="ovr">75</div></div>
<div>Morale <div class="stat" id="morale">80</div></div>
<div>Fatigue <div class="stat" id="fatigue">0</div></div>
<div>Form <div class="stat" id="form">6.8</div></div>
</div>
<div class="flex" style="margin-top:10px">
<div class="small">Week <b id="week">1</b></div>
<div class="small">Month <b id="month">Aug</b></div>
<div class="small">Year <b id="year">2026</b></div>
</div>
</div><!-- ACTIONS --><div class="card">
<h3>Actions</h3>
<button onclick="train()">Train</button>
<button onclick="playMatch()">Play Live Match</button>
<button onclick="rest()">Rest</button>
</div><!-- LIVE MATCH --><div class="card">
<h3>Live Match Engine</h3>
<div class="pitch">
<div class="ball" id="ball"></div>
</div>
<div class="commentary" id="commentary">Awaiting kickoff...</div>
</div><!-- STATS --><div class="card">
<h3>Career Stats</h3>
<div class="flex">
<div>Goals <b id="goals">0</b></div>
<div>Assists <b id="assists">0</b></div>
<div>Matches <b id="matches">0</b></div>
<div>Rating <b id="rating">0</b></div>
</div>
</div><!-- AWARDS --><div class="card">
<h3>Awards</h3>
<div id="awards" class="small">No awards yet</div>
</div><!-- TRANSFERS --><div class="card">
<h3>Transfers</h3>
<div id="transfers"></div>
</div><!-- LEAGUE --><div class="card">
<h3>League Table</h3>
<table class="table">
<tbody id="league"></tbody>
</table>
</div></div><script>

let player={ovr:75,morale:80,fatigue:0,goals:0,assists:0,matches:0,rating:0}

let season={week:1,month:0,year:2026}
const months=["Aug","Sep","Oct","Nov","Dec","Jan","Feb","Mar","Apr","May"]

let league=[
{name:"Man United",pts:82},{name:"Man City",pts:79},{name:"Arsenal",pts:74},{name:"Liverpool",pts:71}
]

let awards=[]
let transfers=[{club:"Real Madrid",wage:"£650k"},{club:"Bayern Munich",wage:"£520k"}]

function save(){localStorage.setItem("career",JSON.stringify({player,season,awards}))}

function advanceTime(){
season.week++
if(season.week%4===0) season.month++
if(season.month>=months.length){season.month=0;season.year++;endSeason()}
}

function train(){
player.ovr+=1
player.fatigue+=5
player.morale+=1
addComment("Training completed")
advanceTime()
updateUI()
save()
}

function rest(){
player.fatigue=Math.max(0,player.fatigue-10)
player.morale+=2
addComment("Rest day")
advanceTime()
updateUI()
save()
}

function playMatch(){
player.matches++
addComment("Kickoff! Match starting...")

let goals=0
let assists=0

let steps=[
{t:1000,text:"JP controls possession",pos:20},
{t:2500,text:"Driving forward",pos:40},
{t:4000,text:"Shot on target!",pos:70},
{t:6000,text:"GOAL!!!",pos:90},
{t:8000,text:"Full time whistle",pos:50}
]

steps.forEach(s=>{
setTimeout(()=>{
addComment(s.text)
animateBall(s.pos)
if(s.text.includes("GOAL")){goals++;player.morale+=3}
},s.t)
})

setTimeout(()=>{
player.goals+=goals
player.assists+=assists
player.rating=6+Math.random()*3
advanceTime()
updateUI()
checkAwards()
save()
addComment("Match finished rating: "+player.rating.toFixed(1))
},9000)
}

function endSeason(){
if(player.goals>15) awards.push("Golden Boot Candidate")
if(player.rating>7.5) awards.push("Team of the Season")
transfers.push({club:"PSG",wage:"£700k"})
addComment("Season ended - transfer window open")
}

function acceptTransfer(i){
player.ovr+=1
player.morale=100
transfers=[]
addComment("Transfer completed!")
updateUI()
}

function checkAwards(){
if(player.rating>8) awards.push("Man of the Match")
}

function animateBall(pos){
document.getElementById("ball").style.left=pos+"%"
}

function addComment(text){
let box=document.getElementById("commentary")
box.innerHTML+="<br>• "+text
box.scrollTop=box.scrollHeight
}

function renderLeague(){
document.getElementById("league").innerHTML=
league.map(l=>`<tr><td>${l.name}</td><td>${l.pts}</td></tr>`).join("")
}

function renderTransfers(){
document.getElementById("transfers").innerHTML=
transfers.map((t,i)=>`<div class='card'>${t.club} ${t.wage||''}<br><button onclick='acceptTransfer(${i})'>Accept</button></div>`).join("")
}

function updateUI(){
document.getElementById("ovr").innerText=player.ovr
document.getElementById("morale").innerText=player.morale
document.getElementById("fatigue").innerText=player.fatigue
document.getElementById("goals").innerText=player.goals
document.getElementById("assists").innerText=player.assists
document.getElementById("matches").innerText=player.matches
document.getElementById("rating").innerText=player.rating.toFixed(1)

document.getElementById("week").innerText=season.week
document.getElementById("month").innerText=months[season.month]
document.getElementById("year").innerText=season.year

let a=document.getElementById("awards")
a.innerHTML=awards.length?awards.join("<br>"):"No awards yet"

renderTransfers()
renderLeague()
}

renderLeague()
renderTransfers()
updateUI()

</script></body>
</html>
