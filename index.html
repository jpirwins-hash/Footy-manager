<!DOCTYPE html>
<html>
<head>
  <title>Football Career Simulator</title>

  <style>
    body {
      font-family: Arial;
      background: #0b0f1a;
      color: white;
      text-align: center;
      padding: 20px;
    }

    .box {
      max-width: 1100px;
      margin: auto;
      background: #151b2d;
      padding: 20px;
      border-radius: 12px;
    }

    #game { display: none; }

    button {
      padding: 10px;
      margin: 5px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
    }

    .start { background: #00c853; }
    .train { background: #00c853; }
    .match { background: #ff9800; }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      border: 1px solid #2a355f;
      padding: 6px;
    }

    th {
      background: #111a33;
    }

    #feed {
      background: #0b1024;
      padding: 10px;
      border-radius: 10px;
      min-height: 140px;
      text-align: left;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .panel {
      background: #1b2440;
      padding: 10px;
      border-radius: 10px;
    }
  </style>
</head>

<body>

<div class="box">

  <!-- INTRO -->
  <div id="intro">
    <h1>⚽ Football Career Simulator</h1>

    <input id="name" placeholder="Name">
    <br><br>

    <button class="start" onclick="startGame()">Start Career</button>
  </div>

  <!-- GAME -->
  <div id="game">

    <h2>👤 Player</h2>
    <p id="player"></p>

    <p>Season Week: <span id="week"></span> / 10</p>
    <p>Season: <span id="season"></span></p>

    <div class="grid">

      <div class="panel">
        <h3>⚽ Actions</h3>
        <button class="train" onclick="train()">Train</button>
        <button class="match" onclick="playMatch()">Play Match</button>
      </div>

      <div class="panel">
        <h3>⚡ Status</h3>
        <p>Fatigue: <span id="fatigue"></span></p>
        <p>Form: <span id="form"></span></p>
      </div>

    </div>

    <h3>📺 Match Feed</h3>
    <div id="feed"></div>

    <h3>🏆 League Table</h3>
    <table>
      <thead>
        <tr>
          <th>Team</th>
          <th>P</th>
          <th>W</th>
          <th>L</th>
          <th>Pts</th>
        </tr>
      </thead>
      <tbody id="table"></tbody>
    </table>

  </div>

</div>

<script>

/* ---------------- GAME ---------------- */

let game = {
  name: "",
  week: 1,
  season: 1,

  fatigue: 100,
  form: 0,

  stats: {
    pace: 40,
    shoot: 40,
    pass: 40,
    fit: 50
  },

  teams: []
};

/* ---------------- LEAGUE ---------------- */

function createTeam(n) {
  return { name: n, p:0, w:0, l:0, pts:0 };
}

function initLeague() {
  game.teams = [
    createTeam("Man City"),
    createTeam("Arsenal"),
    createTeam("Liverpool"),
    createTeam("Chelsea"),
    createTeam("Man United"),
    createTeam("Tottenham"),
    createTeam("Newcastle"),
    createTeam("Aston Villa")
  ];
}

/* ---------------- START ---------------- */

function startGame() {

  game.name = document.getElementById("name").value;
  if (!game.name) return alert("Enter name");

  initLeague();

  document.getElementById("intro").style.display = "none";
  document.getElementById("game").style.display = "block";

  updateUI();
}

/* ---------------- TRAIN ---------------- */

function train() {

  let stat = ["pace","shoot","pass","fit"][Math.random()*4|0];

  game.stats[stat] += 1 + Math.random()*2;

  game.fatigue -= 10;
  if (game.fatigue < 0) game.fatigue = 0;

  addFeed("🏋️ Training improved " + stat);

  updateUI();
}

/* ---------------- MATCH ---------------- */

function playMatch() {

  let opp = game.teams[Math.random()*game.teams.length|0];

  let power =
    game.stats.pace +
    game.stats.shoot +
    game.stats.pass +
    game.stats.fit +
    game.form -
    (game.fatigue < 40 ? 15 : 0);

  let oppPower = 150 + Math.random()*80;

  let youScore = 0;
  let oppScore = 0;

  let feed = ["⚽ vs " + opp.name];

  for (let i=0;i<6;i++) {

    let roll = Math.random()*100;

    if (roll < power/5) {
      youScore++;
      feed.push("🔥 GOAL YOU");
    }

    if (roll < oppPower/6) {
      oppScore++;
      feed.push("💥 Opp goal");
    }
  }

  if (youScore > oppScore) {
    game.form += 2;
    opp.l++;
    opp.pts += 0;
    feed.push("🏆 WIN " + youScore + "-" + oppScore);
  } else {
    game.form -= 2;
    opp.w++;
    opp.pts += 3;
    feed.push("😓 LOSS " + youScore + "-" + oppScore);
  }

  game.fatigue -= 15;
  if (game.fatigue < 0) game.fatigue = 0;

  game.week++;

  if (game.week > 10) endSeason();

  document.getElementById("feed").innerHTML = feed.map(f => "<p>"+f+"</p>").join("");

  updateUI();
}

/* ---------------- SEASON SYSTEM ---------------- */

function endSeason() {

  let sorted = [...game.teams].sort((a,b)=>b.pts-a.pts);

  let winner = sorted[0];

  addFeed("🏆 SEASON END - Champion: " + winner.name);

  game.season++;
  game.week = 1;

  game.teams.forEach(t => {
    t.p = 0; t.w = 0; t.l = 0; t.pts = 0;
  });
}

/* ---------------- FEED ---------------- */

function addFeed(t) {
  document.getElementById("feed").innerHTML =
    "<p>" + t + "</p>" + document.getElementById("feed").innerHTML;
}

/* ---------------- UI ---------------- */

function updateUI() {

  document.getElementById("player").innerText = game.name;

  document.getElementById("week").innerText = game.week;
  document.getElementById("season").innerText = game.season;

  document.getElementById("fatigue").innerText = game.fatigue;
  document.getElementById("form").innerText = game.form;

  let table = "";

  game.teams.forEach(t => {
    table += `
      <tr>
        <td>${t.name}</td>
        <td>${t.p}</td>
        <td>${t.w}</td>
        <td>${t.l}</td>
        <td>${t.pts}</td>
      </tr>
    `;
  });

  document.getElementById("table").innerHTML = table;
}

</script>

</body>
</html>
