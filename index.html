<!DOCTYPE html>
<html>
<head>
  <title>Rangers FC Manager</title>
  <style>
    body {
      font-family: Arial;
      background: #0b1a2b;
      color: white;
      text-align: center;
      padding: 20px;
    }

    button {
      padding: 12px;
      margin: 5px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    .blue { background: #1e90ff; color: white; }
    .green { background: #00c46a; color: white; }
    .red { background: #ff4d4d; color: white; }

    .box {
      background: #12263a;
      padding: 12px;
      margin-top: 12px;
      border-radius: 10px;
    }
  </style>
</head>

<body>

<h1>⚽ Rangers FC Manager</h1>

<div class="box">
  💰 Money: £<span id="money">10</span>M
</div>

<div class="box">
  🎯 Tactic:
  <select id="tactic">
    <option value="attack">Attack</option>
    <option value="balanced">Balanced</option>
    <option value="defend">Defensive</option>
  </select>
</div>

<button class="blue" onclick="playMatch()">Play Match</button>
<button class="green" onclick="buyPlayer()">Buy Player (£2M)</button>
<button class="red" onclick="resetGame()">Reset</button>

<div class="box" id="log">Press Play Match to start</div>

<div class="box" id="table"></div>

<script>
let money = 10;
let index = 0;

let teams = [
  { name: "Rangers", atk: 84, def: 82, pts: 0, gf: 0, ga: 0 },
  { name: "Celtic", atk: 86, def: 83, pts: 0, gf: 0, ga: 0 },
  { name: "Aberdeen", atk: 76, def: 74, pts: 0, gf: 0, ga: 0 },
  { name: "Hearts", atk: 75, def: 73, pts: 0, gf: 0, ga: 0 }
];

let fixtures = [];

function rand(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

// build fixtures
function buildFixtures() {
  fixtures = [];
  for (let i = 0; i < teams.length; i++) {
    for (let j = i + 1; j < teams.length; j++) {
      fixtures.push([teams[i], teams[j]]);
      fixtures.push([teams[j], teams[i]]);
    }
  }
}

buildFixtures();

function playMatch() {
  if (index >= fixtures.length) {
    document.getElementById("log").innerHTML = "Season finished!";
    updateTable();
    return;
  }

  let [home, away] = fixtures[index];

  let tactic = document.getElementById("tactic").value;
  let boost = tactic === "attack" ? 5 : tactic === "defend" ? -5 : 0;

  let homeGoals =
    Math.max(0, Math.floor((home.atk + boost - away.def) / 20) + rand(0, 2));

  let awayGoals =
    Math.max(0, Math.floor((away.atk - home.def) / 20) + rand(0, 2));

  home.gf += homeGoals;
  home.ga += awayGoals;
  away.gf += awayGoals;
  away.ga += homeGoals;

  if (homeGoals > awayGoals) home.pts += 3;
  else if (awayGoals > homeGoals) away.pts += 3;
  else {
    home.pts += 1;
    away.pts += 1;
  }

  document.getElementById("log").innerHTML =
    `${home.name} ${homeGoals} - ${awayGoals} ${away.name}`;

  index++;

  updateTable();
}

function buyPlayer() {
  if (money < 2) {
    alert("Not enough money!");
    return;
  }

  money -= 2;

  teams[0].atk += 1;

  document.getElementById("log").innerHTML =
    "💰 Player signed! Rangers improved";

  document.getElementById("money").innerText = money;
}

function updateTable() {
  let sorted = [...teams].sort((a, b) => b.pts - a.pts);

  let html = "<h3>📊 League Table</h3>";

  sorted.forEach((t, i) => {
    html += `<div>${i + 1}. ${t.name} — ${t.pts} pts (GF ${t.gf}/GA ${t.ga})</div>`;
  });

  let r = sorted.findIndex(t => t.name === "Rangers") + 1;

  html += `<h3>🔵 Rangers Position: ${r}</h3>`;

  document.getElementById("table").innerHTML = html;
}

function resetGame() {
  money = 10;
  index = 0;

  teams.forEach(t => {
    t.pts = 0;
    t.gf = 0;
    t.ga = 0;
  });

  buildFixtures();

  document.getElementById("money").innerText = money;
  document.getElementById("log").innerHTML = "New season started!";
  updateTable();
}

updateTable();
</script>

</body>
</html>
