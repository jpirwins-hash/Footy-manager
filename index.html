<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ultimate Football Career Mode</title>
<style>
body{margin:0;font-family:system-ui,Arial;background:#050814;color:#fff}
header{padding:14px;background:linear-gradient(90deg,#16a34a,#0ea5e9)}
h1{margin:0;font-size:20px}
.container{padding:12px;max-width:1200px;margin:auto}
.card{background:#0f172a;border:1px solid #1f2937;border-radius:14px;padding:12px;margin-top:10px}
button{background:#16a34a;color:#fff;border:0;padding:10px;border-radius:10px;cursor:pointer;font-weight:700}
button:hover{background:#22c55e}
button.secondary{background:#334155}
select,input{padding:10px;border-radius:10px;background:#111827;color:#fff;border:1px solid #1f2937;width:100%}
.flex{display:flex;gap:10px;flex-wrap:wrap}
.tab{padding:8px 12px;background:#1f2937;border-radius:999px;cursor:pointer;font-size:12px}
.tab.active{background:#16a34a}
.small{font-size:12px;color:#94a3b8}
.stat{font-size:18px;font-weight:800}
.hidden{display:none}
.pitch{height:170px;background:linear-gradient(90deg,#14532d,#166534);border-radius:12px;position:relative;overflow:hidden}
.ball{width:14px;height:14px;border-radius:50%;background:#fff;position:absolute;left:10px;top:80px;transition:all .4s linear}
.commentary{height:140px;overflow:auto;font-size:12px;color:#cbd5e1;margin-top:8px}
</style>
</head>
<body><header>
<h1>⚽ ULTIMATE CAREER MODE</h1>
<div class="small">Transfers • Seasons • AI Leagues • Contracts • Match Engine</div>
</header><div class="container"><div id="setup" class="card">
<h2>Create Career</h2>
<input id="name" placeholder="Player Name" />
<select id="league">
<option value="spfl">Scotland</option>
<option value="prem">England</option>
<option value="laliga">Spain</option>
<option value="bundes">Germany</option>
</select>
<button onclick="startCareer()">Start Career</button>
</div><div id="game" class="hidden"><div class="card">
<h2 id="pname"></h2>
<div class="flex">
<div>OVR <div class="stat" id="ovr">65</div></div>
<div>REP <div class="stat" id="rep">50</div></div>
<div>FIT <div class="stat" id="fit">100</div></div>
<div>MOR <div class="stat" id="mor">80</div></div>
</div>
<div class="small">Week <span id="week">1</span> • Season <span id="season">1</span></div>
</div><div class="card">
<div class="flex">
<div class="tab active" onclick="tab('dash')">Dashboard</div>
<div class="tab" onclick="tab('squad')">Squad</div>
<div class="tab" onclick="tab('match')">Matches</div>
<div class="tab" onclick="tab('train')">Training</div>
<div class="tab" onclick="tab('transfer')">Transfers</div>
<div class="tab" onclick="tab('table')">League</div>
</div>
</div><div id="dash" class="card">
<h3>Club Hub</h3>
<div id="clubInfo">No club</div>
<div id="objectives" class="small"></div>
</div><div id="squad" class="card hidden">
<h3>Squad</h3>
<div id="squadList"></div>
</div><div id="match" class="card hidden">
<h3>Match Engine</h3>
<button onclick="playMatch()">Simulate Match</button>
<div class="pitch"><div class="ball" id="ball"></div></div>
<div id="log" class="commentary"></div>
</div><div id="train" class="card hidden">
<h3>Training</h3>
<button onclick="train('shoot')">Finishing</button>
<button onclick="train('pass')">Passing</button>
<button onclick="train('fit')">Fitness</button>
</div><div id="transfer" class="card hidden">
<h3>Transfers</h3>
<div id="offers"></div>
</div><div id="table" class="card hidden">
<h3>League Table</h3>
<div id="leagueTable"></div>
</div></div><script>

let player={name:"",ovr:65,rep:50,fit:100,mor:80,week:1,season:1,club:null}
let leagueData=null
let squad=[]
let offers=[]

const leagues={
spfl:{name:"SPFL",clubs:[{name:"Rangers",ovr:78,pts:0,players:["Tavernier","Cantwell","Danilo"]},{name:"Celtic",ovr:80,pts:0,players:["Kyogo","McGregor","Hatate"]}]},
prem:{name:"Premier League",clubs:[{name:"Man United",ovr:82,pts:0,players:["Bruno","Rashford","Hojlund"]},{name:"Man City",ovr:88,pts:0,players:["Haaland","De Bruyne","Foden"]}]},
laliga:{name:"La Liga",clubs:[{name:"Real Madrid",ovr:89,pts:0,players:["Bellingham","Vinicius","Rodrygo"]}]},
bundes:{name:"Bundesliga",clubs:[{name:"Bayern",ovr:88,pts:0,players:["Kane","Musiala","Kimmich"]}]}
}

function startCareer(){
player.name=document.getElementById("name").value||"Player"
leagueData=leagues[document.getElementById("league").value]
offers=generateOffers()
show()
renderOffers()
updateUI()
renderLeague()
}

function generateOffers(){
return leagueData.clubs.map(c=>({club:c,wage:"£"+(120+Math.random()*200|0)+"k",role:Math.random()>0.5?"Important":"Rotation"}))
}

function startCareer(){
player.name=document.getElementById("name").value||"Player"
leagueData=leagues[document.getElementById("league").value]
offers=generateOffers()
show()
renderOffers()
updateUI()
renderLeague()
}

function acceptOffer(i){
player.club=offers[i].club
squad=player.club.players
offers=[]
player.rep+=10
updateClub()
}

function updateClub(){
document.getElementById("clubInfo").innerText="Club: "+player.club.name+" OVR "+player.club.ovr
renderSquad()
renderObjectives()
}

function renderObjectives(){
document.getElementById("objectives").innerText="Objectives: Score, assist, maintain form"
}

function renderSquad(){
document.getElementById("squadList").innerHTML=squad.map(p=>"• "+p).join("<br>")}

function tab(t){
["dash","squad","match","train","transfer","table"].forEach(x=>document.getElementById(x).classList.add("hidden"))
document.getElementById(t).classList.remove("hidden")
if(t=="table")renderLeague()
}

function log(t){document.getElementById("log").innerHTML+="<br>• "+t}
function moveBall(x){document.getElementById("ball").style.left=x+"%"}

function train(type){
if(type=="shoot")player.ovr+=0.4
if(type=="pass")player.ovr+=0.2
if(type=="fit")player.fit+=5
player.rep+=1
player.mor+=1
}

function playMatch(){
if(!player.club)return
let g=0
log("Kickoff vs "+player.club.name)
for(let i=0;i<10;i++){
setTimeout(()=>{
moveBall(Math.random()*100)
let r=Math.random()
if(r>0.9){log("GOAL!!!");g++;player.rep+=5}
else if(r>0.6)log("Shot")
else log("Play")
},i*500)
}
setTimeout(()=>{player.week++;if(player.week>38){player.week=1;player.season++}player.ovr+=0.2;updateUI();log("FT Goals:"+g)},6000)
}

function renderLeague(){
let sorted=[...leagueData.clubs].sort((a,b)=>b.pts-a.pts)
document.getElementById("leagueTable").innerHTML=sorted.map((c,i)=>`${i+1}. ${c.name} ${c.pts}pts`).join("<br>")
}

function renderOffers(){
document.getElementById("offers").innerHTML=offers.map((o,i)=>`<div class='card'><b>${o.club.name}</b><br>${o.role}<br>${o.wage}<br><button onclick='acceptOffer(${i})'>Accept</button></div>`).join("")
}

function show(){document.getElementById("setup").classList.add("hidden");document.getElementById("game").classList.remove("hidden");document.getElementById("pname").innerText=player.name}

function updateUI(){
document.getElementById("ovr").innerText=Math.floor(player.ovr)
document.getElementById("rep").innerText=player.rep
document.getElementById("fit").innerText=player.fit
document.getElementById("mor").innerText=player.mor
document.getElementById("week").innerText=player.week
document.getElementById("season").innerText=player.season
}

</script></body>
</html>
