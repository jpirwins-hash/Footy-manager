<!DOCTYPE html>
<html>
<head>
  <title>Rangers FC Manager</title>
  <style>
    body {
      font-family: Arial;
      background: #0b1a2b;
      color: white;
      text-align: center;
      padding: 20px;
    }

    button {
      padding: 12px 20px;
      margin: 10px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .start {
      background: #1e90ff;
      color: white;
    }

    .box {
      background: #12263a;
      padding: 15px;
      margin-top: 15px;
      border-radius: 10px;
    }

    .green { color: #00ff99; }
    .red { color: #ff4d4d; }
  </style>
</head>

<body>

<h1>⚽ Rangers FC Manager</h1>
<p>You are the manager of Rangers FC</p>

<button class="start" onclick="startSeason()">Start Season</button>

<div class="box" id="output">Press start to begin your season</div>

<script>
let teams = [
  { name: "Rangers", attack: 84, defence: 82, points: 0, gf: 0, ga: 0 },
  { name: "Celtic", attack: 86, defence: 83, points: 0, gf: 0, ga: 0 },
  { name: "Aberdeen", attack: 76, defence: 74, points: 0, gf: 0, ga: 0 },
  { name: "Hearts", attack: 75, defence: 73, points: 0, gf: 0, ga: 0 }
];

function rand(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function match(a, b) {
  let aScore =
    Math.floor((a.attack - b.defence) / 20) + rand(0, 2);

  let bScore =
    Math.floor((b.attack - a.defence) / 20) + rand(0, 2);

  aScore = Math.max(0, aScore);
  bScore = Math.max(0, bScore);

  a.gf += aScore;
  a.ga += bScore;
  b.gf += bScore;
  b.ga += aScore;

  if (aScore > bScore) a.points += 3;
  else if (bScore > aScore) b.points += 3;
  else {
    a.points += 1;
    b.points += 1;
  }

  return `${a.name} ${aScore} - ${bScore} ${b.name}`;
}

function startSeason() {
  let log = "<h2>🏆 Season Results</h2>";

  // play season
  for (let i = 0; i < teams.length; i++) {
    for (let j = i + 1; j < teams.length; j++) {
      log += match(teams[i], teams[j]) + "<br>";
      log += match(teams[j], teams[i]) + "<br>";
    }
  }

  // table
  teams.sort((a, b) => b.points - a.points);

  log += "<h2>📊 League Table</h2>";

  teams.forEach((t, i) => {
    log += `
      <div>
        ${i + 1}. ${t.name} — 
        <span class="green">${t.points} pts</span> 
        (GF ${t.gf} / GA ${t.ga})
      </div>
    `;
  });

  let rangers = teams.find(t => t.name === "Rangers");
  let pos = teams.indexOf(rangers) + 1;

  log += "<h2>🔵 Rangers Result</h2>";

  if (pos === 1) {
    log += "<p class='green'>🏆 CHAMPIONS OF SCOTLAND!</p>";
  } else if (pos <= 2) {
    log += "<p class='green'>🥈 Champions League spot!</p>";
  } else {
    log += "<p class='red'>⚠️ Tough season — rebuild needed</p>";
  }

  document.getElementById("output").innerHTML = log;
}
</script>

</body>
</html>
