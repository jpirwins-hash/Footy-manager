<!DOCTYPE html>
<html>
<head>
  <title>Football Career Simulator</title>
  <style>
    body {
      font-family: Arial;
      background: #0b0f1a;
      color: white;
      text-align: center;
      padding: 20px;
    }

    .box {
      max-width: 800px;
      margin: auto;
      background: #151b2d;
      padding: 20px;
      border-radius: 12px;
    }

    button {
      padding: 10px;
      margin: 5px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .train { background: #00c853; }
    .match { background: #ff9800; }
    .save { background: #2979ff; }
    .reset { background: #ff3d00; }

    .offer {
      background: #222c44;
      padding: 15px;
      border-radius: 10px;
      margin-top: 10px;
      display: none;
    }

    .accept { background: #00c853; }
    .reject { background: #ff3d00; }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    .card {
      background: #1f2942;
      padding: 10px;
      border-radius: 10px;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>⚽ Football Career Simulator</h1>

  <h2>👤 Player Profile</h2>
  <p>Age: <span id="age"></span></p>
  <p>Club: <span id="club"></span></p>
  <p>Money: £<span id="money"></span></p>
  <p>Reputation: <span id="rep"></span></p>

  <hr>

  <h2>📊 Stats</h2>
  <div class="stats">
    <div class="card">⚡ Pace: <span id="pace"></span></div>
    <div class="card">🎯 Shooting: <span id="shoot"></span></div>
    <div class="card">🎮 Passing: <span id="pass"></span></div>
    <div class="card">💪 Fitness: <span id="fit"></span></div>
  </div>

  <hr>

  <h2>🎮 Actions</h2>

  <button class="train" onclick="train()">Train</button>
  <button class="match" onclick="playMatch()">Play Match</button>
  <button class="save" onclick="saveGame()">Save</button>
  <button class="reset" onclick="resetGame()">Reset</button>

  <hr>

  <div id="offerBox" class="offer">
    <h2>📩 Transfer Offer</h2>
    <p id="offerText"></p>
    <button class="accept" onclick="acceptOffer()">Accept</button>
    <button class="reject" onclick="rejectOffer()">Reject</button>
  </div>

  <hr>

  <h2>📰 Career Log</h2>
  <div id="log"></div>

</div>

<script>

/* -----------------------
   GAME STATE
------------------------*/

let game = {
  age: 16,
  club: "Youth Academy",
  money: 0,
  rep: 0,

  stats: {
    pace: 30,
    shoot: 30,
    pass: 30,
    fit: 50
  },

  log: [],
  offer: null
};

/* -----------------------
   LOAD / SAVE
------------------------*/
function loadGame() {
  let save = localStorage.getItem("footballGame");
  if (save) game = JSON.parse(save);
}
loadGame();

function saveGame() {
  localStorage.setItem("footballGame", JSON.stringify(game));
  addLog("💾 Game saved");
}

function resetGame() {
  localStorage.removeItem("footballGame");
  location.reload();
}

/* -----------------------
   LOG SYSTEM
------------------------*/
function addLog(text) {
  game.log.unshift(text);
  if (game.log.length > 8) game.log.pop();
}

/* -----------------------
   TRAINING
------------------------*/
function train() {
  let stat = ["pace", "shoot", "pass"][Math.floor(Math.random() * 3)];

  game.stats[stat] += Math.floor(Math.random() * 3) + 1;
  game.stats.fit -= 2;

  game.age += 0.1;

  addLog(`🏋️ Improved ${stat}`);
  updateUI();
}

/* -----------------------
   MATCH SIMULATION
------------------------*/
function playMatch() {
  let rating =
    game.stats.pace +
    game.stats.shoot +
    game.stats.pass +
    game.stats.fit;

  let opponent = 120 + Math.random() * 80;

  game.age += 0.2;

  if (rating > opponent) {
    game.money += 500;
    game.rep += 5;
    addLog("🏆 Won the match!");
  } else {
    game.rep += 1;
    addLog("😓 Lost the match...");
  }

  checkTransferOffer();
  levelUpCheck();
  updateUI();
}

/* -----------------------
   TRANSFER SYSTEM
------------------------*/
function checkTransferOffer() {
  let chance = Math.random();

  if (chance > 0.6) {
    let clubs = [
      { name: "City Rovers", rep: 10, salary: 300 },
      { name: "United Town", rep: 25, salary: 800 },
      { name: "FC Albion", rep: 50, salary: 1500 },
      { name: "Elite Stars", rep: 80, salary: 3000 }
    ];

    let offer = clubs[Math.floor(Math.random() * clubs.length)];

    if (game.rep >= offer.rep) {
      game.offer = offer;
      showOffer();
    }
  }
}

   OFFER
