<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ultimate Football Career Mode</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet"><style>

:root{
  --bg:#050814;
  --panel:rgba(15,23,42,0.72);
  --stroke:rgba(148,163,184,0.18);
  --green:#22c55e;
  --blue:#38bdf8;
  --text:#e2e8f0;
  --muted:#94a3b8;
  --gold:#fbbf24;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Inter,system-ui,Arial;
  background:radial-gradient(circle at top,#0b1228,var(--bg));
  color:var(--text);
  overflow-x:hidden;
}

body::before{
  content:"";
  position:fixed;
  inset:-200px;
  background:
    radial-gradient(circle at 20% 20%, rgba(34,197,94,0.18), transparent 40%),
    radial-gradient(circle at 80% 30%, rgba(56,189,248,0.15), transparent 45%),
    radial-gradient(circle at 50% 80%, rgba(251,191,36,0.08), transparent 40%);
  animation:floatBG 12s ease-in-out infinite alternate;
  z-index:-1;
}

@keyframes floatBG{
  0%{transform:translateY(0px) scale(1)}
  100%{transform:translateY(20px) scale(1.05)}
}

header{
  padding:18px;
  background:linear-gradient(90deg,#16a34a,#0ea5e9);
  box-shadow:0 10px 40px rgba(0,0,0,0.5);
  position:sticky;
  top:0;
  z-index:10;
  backdrop-filter:blur(10px);
}

h1{margin:0;font-size:24px;letter-spacing:2px}

.container{padding:16px;max-width:1200px;margin:auto}

.card{
  background:var(--panel);
  border:1px solid var(--stroke);
  border-radius:20px;
  padding:16px;
  margin-top:14px;
  backdrop-filter:blur(18px);
  box-shadow:0 20px 60px rgba(0,0,0,0.45);
  transition:all .25s ease;
  position:relative;
  overflow:hidden;
}

.card:hover{transform:translateY(-3px);border-color:rgba(34,197,94,0.4)}

button{
  background:linear-gradient(135deg,#16a34a,#22c55e);
  color:#fff;border:0;padding:10px 14px;
  border-radius:14px;cursor:pointer;font-weight:900;
  box-shadow:0 10px 30px rgba(34,197,94,0.25);
}

button:hover{transform:scale(1.05)}

input,select{
  padding:12px;border-radius:12px;
  background:rgba(17,24,39,0.85);
  border:1px solid var(--stroke);
  color:white;width:100%
}

.tabs{display:flex;gap:8px;flex-wrap:wrap}

.tab{
  padding:10px 14px;border-radius:999px;
  background:rgba(30,41,59,0.6);
  cursor:pointer;font-size:12px;
  font-weight:700;
}

.tab.active{background:rgba(34,197,94,0.25);border:1px solid rgba(34,197,94,0.5)}

.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.hud div{background:rgba(0,0,0,0.25);padding:10px;border-radius:14px;text-align:center}
.stat{font-size:22px;font-weight:900}

.pitch{
  height:200px;
  background:linear-gradient(90deg,#14532d,#166534);
  border-radius:16px;
  position:relative;
  overflow:hidden;
}

.ball{
  width:16px;height:16px;border-radius:50%;background:white;
  position:absolute;left:10px;top:80px;
  transition:all .25s ease;
  box-shadow:0 0 20px rgba(255,255,255,0.9);
}

.commentary{
  height:150px;overflow:auto;
  font-size:12px;color:#cbd5e1;
  margin-top:10px;padding:10px;
  background:rgba(0,0,0,0.3);
  border-radius:12px;
}

.titleGlow{
  font-size:26px;font-weight:900;
  background:linear-gradient(90deg,#22c55e,#38bdf8,#fbbf24);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}

</style></head>
<body><header>
<h1>⚽ CAREER MODE ULTRA</h1>
<div style="font-size:12px">Next-gen UI • Transfers • Matches • Seasons</div>
</header><div class="container"><div id="setup" class="card">
<div class="titleGlow">Start Career</div>
<input id="name" placeholder="Player Name" />
<select id="league">
<option value="spfl">Scotland</option>
<option value="prem">England</option>
<option value="laliga">Spain</option>
<option value="bundes">Germany</option>
</select>
<button onclick="startCareer()">Begin</button>
</div><div id="game" class="hidden"><div class="card">
<h2 id="pname"></h2>
<div class="hud">
<div>OVR<div class="stat" id="ovr">65</div></div>
<div>REP<div class="stat" id="rep">50</div></div>
<div>FIT<div class="stat" id="fit">100</div></div>
<div>MOR<div class="stat" id="mor">80</div></div>
</div>
<div style="font-size:12px">Week <span id="week">1</span> • Season <span id="season">1</span></div>
</div><div class="card">
<div class="tabs">
<div class="tab active" onclick="tab('dash')">Dashboard</div>
<div class="tab" onclick="tab('squad')">Squad</div>
<div class="tab" onclick="tab('match')">Matches</div>
<div class="tab" onclick="tab('train')">Training</div>
<div class="tab" onclick="tab('transfer')">Transfers</div>
<div class="tab" onclick="tab('table')">League</div>
</div>
</div><div id="dash" class="card">
<h3>Club Hub</h3>
<div id="clubInfo"></div>
<div id="objectives" style="font-size:12px"></div>
</div><div id="squad" class="card hidden">
<h3>Squad</h3>
<div id="squadList"></div>
</div><div id="match" class="card hidden">
<h3>Live Match</h3>
<button onclick="playMatch()">Simulate</button>
<div class="pitch"><div class="ball" id="ball"></div></div>
<div id="log" class="commentary"></div>
</div><div id="train" class="card hidden">
<h3>Training</h3>
<button onclick="train('shoot')">Finishing</button>
<button onclick="train('pass')">Passing</button>
<button onclick="train('fit')">Fitness</button>
</div><div id="transfer" class="card hidden">
<h3>Offers</h3>
<div id="offers"></div>
</div><div id="table" class="card hidden">
<h3>League Table</h3>
<div id="leagueTable"></div>
</div></div><script>

let player={name:"",ovr:65,rep:50,fit:100,mor:80,week:1,season:1,club:null}
let leagueData=null
let squad=[]
let offers=[]

const leagues={
spfl:{name:"SPFL",clubs:[{name:"Rangers",ovr:78,pts:0,players:["Tavernier","Cantwell","Danilo"]},{name:"Celtic",ovr:80,pts:0,players:["Kyogo","McGregor","Hatate"]}]},
prem:{name:"Premier League",clubs:[{name:"Man United",ovr:82,pts:0,players:["Bruno","Rashford","Hojlund"]},{name:"Man City",ovr:88,pts:0,players:["Haaland","De Bruyne","Foden"]}]},
laliga:{name:"La Liga",clubs:[{name:"Real Madrid",ovr:89,pts:0,players:["Bellingham","Vinicius","Rodrygo"]}]},
bundes:{name:"Bundesliga",clubs:[{name:"Bayern",ovr:88,pts:0,players:["Kane","Musiala","Kimmich"]}]}
}

function startCareer(){
player.name=document.getElementById("name").value||"Player"
leagueData=leagues[document.getElementById("league").value]
offers=leagueData.clubs.map(c=>({club:c,wage:"£"+(120+Math.random()*200|0)+"k",role:"Squad"}))
document.getElementById("setup").classList.add("hidden")
document.getElementById("game").classList.remove("hidden")
updateUI()
renderOffers()
}

function tab(t){
["dash","squad","match","train","transfer","table"].forEach(x=>document.getElementById(x).classList.add("hidden"))
document.getElementById(t).classList.remove("hidden")
if(t=="table")renderLeague()
}

function acceptOffer(i){
player.club=offers[i].club
squad=player.club.players
offers=[]
updateClub()
}

function updateClub(){
document.getElementById("clubInfo").innerHTML=`<b>${player.club.name}</b> OVR ${player.club.ovr}`
document.getElementById("objectives").innerText="Perform, improve, win"
renderSquad()
}

function renderSquad(){
document.getElementById("squadList").innerHTML=squad.map(p=>"• "+p).join("<br>")}

function train(type){
if(type=="shoot")player.ovr+=0.4
if(type=="pass")player.ovr+=0.2
if(type=="fit")player.fit+=5
player.rep+=1
player.mor+=1
updateUI()
}

function playMatch(){
if(!player.club)return
let g=0
log("Kickoff")
for(let i=0;i<12;i++){
setTimeout(()=>{
moveBall(Math.random()*100)
let r=Math.random()
if(r>0.9){log("GOAL!");g++;player.rep+=5}
else if(r>0.65)log("Shot")
else log("Play")
},i*450)
}
setTimeout(()=>{
player.week++
if(player.week>38){player.week=1;player.season++}
updateUI()
log("FT: "+g)
},6500)
}

function renderOffers(){
document.getElementById("offers").innerHTML=offers.map((o,i)=>`<div class='card'><b>${o.club.name}</b><br>${o.role}<br>${o.wage}<br><button onclick='acceptOffer(${i})'>Accept</button></div>`).join("")
}

function renderLeague(){
let sorted=[...leagueData.clubs].sort((a,b)=>b.pts-a.pts)
document.getElementById("leagueTable").innerHTML=sorted.map((c,i)=>`${i+1}. ${c.name} ${c.pts}`).join("<br>")
}

function updateUI(){
document.getElementById("pname").innerText=player.name
document.getElementById("ovr").innerText=Math.floor(player.ovr)
document.getElementById("rep").innerText=player.rep
document.getElementById("fit").innerText=player.fit
document.getElementById("mor").innerText=player.mor
document.getElementById("week").innerText=player.week
document.getElementById("season").innerText=player.season
}

function log(t){document.getElementById("log").innerHTML+="• "+t+"<br>"}
function moveBall(x){document.getElementById("ball").style.left=x+"%"}

</script></body>
  </html>
