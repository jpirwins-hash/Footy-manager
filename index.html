<!DOCTYPE html>
<html>
<head>
  <title>Football Career Simulator</title>

  <style>
    body {
      font-family: Arial;
      background: #0b0f1a;
      color: white;
      text-align: center;
      padding: 20px;
    }

    .box {
      max-width: 1000px;
      margin: auto;
      background: #151b2d;
      padding: 20px;
      border-radius: 12px;
    }

    button {
      padding: 10px;
      margin: 5px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .start { background: #00c853; }
    .train { background: #00c853; }
    .match { background: #ff9800; }
    .offer { background: #9c27b0; }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .card {
      background: #1f2942;
      padding: 10px;
      border-radius: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      border: 1px solid #2a355f;
      padding: 6px;
    }

    th {
      background: #1b2550;
    }

    #game { display: none; }

    #commentary {
      background: #0b1024;
      padding: 10px;
      border-radius: 10px;
      min-height: 120px;
      text-align: left;
    }

    #offers {
      background: #111a33;
      padding: 10px;
      margin-top: 10px;
      border-radius: 10px;
    }
  </style>
</head>

<body>

<div class="box">

  <!-- INTRO -->
  <div id="intro">
    <h1>⚽ Football Career Simulator</h1>

    <input id="playerName" placeholder="Name">

    <br>

    <select id="position">
      <option value="striker">Striker ⚽</option>
      <option value="midfielder">Midfielder 🎮</option>
      <option value="defender">Defender 🛡️</option>
    </select>

    <br><br>

    <button class="start" onclick="startGame()">Start Career</button>
  </div>

  <!-- GAME -->
  <div id="game">

    <h1>⚽ Career Mode</h1>

    <p>Name: <span id="name"></span></p>
    <p>Club: <span id="club"></span></p>
    <p>Reputation: <span id="rep"></span></p>
    <p>Wage: £<span id="wage"></span>/match</p>

    <p>Fatigue: <span id="fatigue"></span></p>
    <p>Form: <span id="form"></span></p>

    <hr>

    <button class="train" onclick="train()">Train</button>
    <button class="match" onclick="playMatch()">Play Match</button>
    <button class="offer" onclick="checkOffers()">Check Offers</button>

    <hr>

    <div id="offers"></div>

    <hr>

    <h2>📺 Match Feed</h2>
    <div id="commentary"></div>

  </div>

</div>

<script>

/* ---------------- STATE ---------------- */

let game = {
  started: false,
  name: "",
  position: "",
  club: "Manchester United",

  rep: 0,
  fatigue: 100,
  form: 0,

  wage: 100,

  offers: [],

  stats: {
    pace: 30,
    shoot: 30,
    pass: 30,
    fit: 50
  }
};

/* ---------------- START ---------------- */

function startGame() {

  let name = document.getElementById("playerName").value;
  let pos = document.getElementById("position").value;

  if (!name) return alert("Enter name");

  game.started = true;
  game.name = name;
  game.position = pos;

  if (pos === "striker") game.stats.shoot += 10;
  if (pos === "midfielder") game.stats.pass += 10;
  if (pos === "defender") game.stats.fit += 10;

  document.getElementById("intro").style.display = "none";
  document.getElementById("game").style.display = "block";

  updateUI();
}

/* ---------------- TRAIN ---------------- */

function train() {

  let stat = ["pace","shoot","pass"][Math.random()*3|0];

  game.stats[stat] += 1 + Math.random()*2;

  game.fatigue -= 10;
  if (game.fatigue < 0) game.fatigue = 0;

  game.rep += 1;

  updateUI();
}

/* ---------------- MATCH ---------------- */

function playMatch() {

  let power =
    game.stats.pace +
    game.stats.shoot +
    game.stats.pass +
    game.stats.fit +
    game.rep +
    game.form -
    (game.fatigue < 40 ? 20 : 0);

  let opponent = 150 + Math.random()*90;

  game.fatigue -= 15;
  if (game.fatigue < 0) game.fatigue = 0;

  let win = power > opponent;

  if (win) {
    game.rep += 5;
    game.form += 2;
    addFeed("🏆 Great performance!");
  } else {
    game.rep += 1;
    game.form -= 2;
    addFeed("😓 Tough match...");
  }

  game.form = Math.max(-10, Math.min(10, game.form));

  maybeOffer();

  updateUI();
}

/* ---------------- REAL CLUBS ---------------- */

function maybeOffer() {

  if (Math.random() > 0.6) {

    let clubs = [
      { name:"Liverpool", rep: 15, wage: 150 },
      { name:"Arsenal", rep: 20, wage: 180 },
      { name:"Chelsea", rep: 25, wage: 220 },
      { name:"Manchester City", rep: 30, wage: 300 },
      { name:"Real Madrid", rep: 40, wage: 500 },
      { name:"Barcelona", rep: 35, wage: 450 },
      { name:"Bayern Munich", rep: 35, wage: 420 },
      { name:"PSG", rep: 30, wage: 400 }
    ];

    let offer = clubs[Math.floor(Math.random()*clubs.length)];

    if (game.rep >= offer.rep - 10) {
      game.offers.push(offer);
      addFeed("📩 Offer from " + offer.name);
    }
  }
}

/* ---------------- OFFERS ---------------- */

function checkOffers() {

  let html = "<h3>📩 Transfer Offers</h3>";

  if (game.offers.length === 0) {
    html += "<p>No offers yet</p>";
  }

  game.offers.forEach((o,i) => {
    html += `
      <p>
        ${o.name} - £${o.wage}
        <button onclick="accept(${i})">Join</button>
      </p>
    `;
  });

  document.getElementById("offers").innerHTML = html;
}

function accept(i) {

  let offer = game.offers[i];

  game.club = offer.name;
  game.wage = offer.wage;

  game.offers = [];

  addFeed("✍️ Signed for " + offer.name);

  updateUI();
}

/* ---------------- FEED ---------------- */

function addFeed(t) {
  document.getElementById("commentary").innerHTML =
    `<p>${t}</p>` + document.getElementById("commentary").innerHTML;
}

/* ---------------- UI ---------------- */

function updateUI() {

  document.getElementById("name").innerText = game.name;
  document.getElementById("club").innerText = game.club;
  document.getElementById("rep").innerText = game.rep;
  document.getElementById("wage").innerText = game.wage;
  document.getElementById("fatigue").innerText = game.fatigue;
  document.getElementById("form").innerText = game.form;
}

</script>

</body>
</html>
