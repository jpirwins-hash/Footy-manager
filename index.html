<!DOCTYPE html>
<html>
<head>
  <title>Football Career Simulator</title>
  <style>
    body {
      font-family: Arial;
      background: #0b0f1a;
      color: white;
      text-align: center;
      padding: 20px;
    }

    .box {
      max-width: 950px;
      margin: auto;
      background: #151b2d;
      padding: 20px;
      border-radius: 12px;
    }

    button {
      padding: 10px;
      margin: 5px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .start { background: #00c853; }
    .train { background: #00c853; }
    .match { background: #ff9800; }
    .save { background: #2979ff; }
    .reset { background: #ff3d00; }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .card {
      background: #1f2942;
      padding: 10px;
      border-radius: 10px;
    }

    table {
      width: 100%;
      margin-top: 10px;
      border-collapse: collapse;
    }

    th, td {
      border: 1px solid #333;
      padding: 6px;
    }

    th {
      background: #222c44;
    }

    #game { display: none; }
    #commentary {
      background: #0f1629;
      padding: 10px;
      border-radius: 10px;
      min-height: 120px;
      text-align: left;
    }

    #log { text-align: left; }
  </style>
</head>

<body>

<div class="box">

  <!-- INTRO -->
  <div id="intro">
    <h1>⚽ Football Career Simulator</h1>

    <h2>Start Your Career</h2>

    <input id="playerName" placeholder="Enter name">

    <br><br>

    <select id="position">
      <option value="striker">Striker ⚽</option>
      <option value="midfielder">Midfielder 🎮</option>
      <option value="defender">Defender 🛡️</option>
    </select>

    <br><br>

    <button class="start" onclick="startGame()">Start Career</button>
  </div>

  <!-- GAME -->
  <div id="game">

    <h1>⚽ Career Mode</h1>

    <h2>👤 Player</h2>
    <p>Name: <span id="name"></span></p>
    <p>Position: <span id="pos"></span></p>
    <p>Age: <span id="age"></span></p>
    <p>Club: <span id="club"></span></p>
    <p>Money: £<span id="money"></span></p>
    <p>Reputation: <span id="rep"></span></p>
    <p>Week: <span id="week"></span>/10</p>

    <hr>

    <h2>📊 Stats</h2>
    <div class="grid">
      <div class="card">⚡ Pace: <span id="pace"></span></div>
      <div class="card">🎯 Shooting: <span id="shoot"></span></div>
      <div class="card">🎮 Passing: <span id="pass"></span></div>
      <div class="card">💪 Fitness: <span id="fit"></span></div>
    </div>

    <hr>

    <button class="train" onclick="train()">Train</button>
    <button class="match" onclick="playMatch()">Play Match</button>
    <button class="save" onclick="saveGame()">Save</button>
    <button class="reset" onclick="resetGame()">Reset</button>

    <hr>

    <h2>📺 Live Commentary</h2>
    <div id="commentary"></div>

    <hr>

    <h2>🏆 League</h2>
    <table>
      <thead>
        <tr>
          <th>Team</th>
          <th>P</th>
          <th>W</th>
          <th>L</th>
          <th>Pts</th>
        </tr>
      </thead>
      <tbody id="table"></tbody>
    </table>

    <hr>

    <h2>📰 Log</h2>
    <div id="log"></div>

  </div>

</div>

<script>

/* ---------------- SAFE GAME STATE ---------------- */

let game = getDefaultGame();

/* ---------------- SAFE LOAD ---------------- */

function loadGame() {
  try {
    let save = localStorage.getItem("football_safe");
    if (save) {
      let parsed = JSON.parse(save);
      if (parsed && parsed.stats && parsed.teams) {
        game = parsed;
      }
    }
  } catch (e) {
    console.log("Save corrupted - resetting");
  }
}

loadGame();

/* ---------------- DEFAULT GAME ---------------- */

function getDefaultGame() {
  return {
    started: false,
    name: "",
    position: "",
    age: 16,
    club: "You FC",
    money: 0,
    rep: 0,
    week: 1,

    stats: {
      pace: 30,
      shoot: 30,
      pass: 30,
      fit: 50
    },

    teams: [],
    log: []
  };
}

/* ---------------- INIT LEAGUE ---------------- */

function createTeam(name) {
  return { name, played: 0, wins: 0, losses: 0, points: 0 };
}

function initLeague() {
  game.teams = [
    createTeam("You FC"),
    createTeam("North Town"),
    createTeam("City Rovers"),
    createTeam("Albion FC"),
    createTeam("West United"),
    createTeam("Rangers City")
  ];
}

/* ---------------- START GAME ---------------- */

function startGame() {

  let name = document.getElementById("playerName").value;
  let pos = document.getElementById("position").value;

  if (!name || name.trim() === "") {
    alert("Enter a name!");
    return;
  }

  game = getDefaultGame();

  game.started = true;
  game.name = name.trim();
  game.position = pos;

  if (pos === "striker") game.stats.shoot += 10;
  if (pos === "midfielder") game.stats.pass += 10;
  if (pos === "defender") game.stats.fit += 10;

  initLeague();

  document.getElementById("intro").style.display = "none";
  document.getElementById("game").style.display = "block";

  addLog("🎮 Career started!");
  updateUI();
}

/* ---------------- SAFE SAVE ---------------- */

function saveGame() {
  try {
    localStorage.setItem("football_safe", JSON.stringify(game));
    addLog("💾 Saved");
  } catch (e) {
    alert("Save failed");
  }
}

/* ---------------- RESET ---------------- */

function resetGame() {
  localStorage.removeItem("football_safe");
  location.reload();
}

/* ---------------- LOG ---------------- */

function addLog(t) {
  game.log.unshift(t);
  if (game.log.length > 10) game.log.pop();
}

/* ---------------- TRAIN ---------------- */

function train() {
  let stat = ["pace", "shoot", "pass"][Math.floor(Math.random() * 3)];

  game.stats[stat] += Math.floor(Math.random() * 3) + 1;
  game.stats.fit -= 2;
  game.age += 0.1;

  addLog("🏋️ Improved " + stat);
  updateUI();
}

/* ---------------- MATCH ---------------- */

function playMatch() {

  let opp = game.teams[Math.floor(Math.random() * game.teams.length)];
  let you = game.teams.find(t => t.name === game.club);

  let power =
    game.stats.pace +
    game.stats.shoot +
    game.stats.pass +
    game.stats.fit +
    game.rep;

  let oppPower = 140 + Math.random() * 90;

  you.played++;
  opp.played++;

  game.age += 0.2;

  let result;

  if (power > oppPower) {
    you.wins++;
    you.points += 3;
    opp.losses++;
    game.money += 300;
    game.rep += 5;
    addLog("🏆 Won vs " + opp.name);
    result = "win";
  } else {
    you.losses++;
    opp.wins++;
    opp.points += 3;
    game.rep += 1;
    addLog("😓 Lost vs " + opp.name);
    result = "loss";
  }

  game.week++;

  if (game.week > 10) endSeason();

  liveCommentary(result);
  updateUI();
}

/* ---------------- COMMENTARY ---------------- */

function liveCommentary(result) {

  let lines = [
    "Kick-off!",
    "Midfield battle...",
    "Chance created!",
    "Shot on goal!",
    "Defensive pressure!"
  ];

  lines.push(result === "win"
    ? "GOAL! YOU WIN!"
    : "Full time... defeat.");

  let html = "";
  lines.forEach(l => html += `<p>⚽ ${l}</p>`);

  document.getElementById("commentary").innerHTML = html;
}

/* ---------------- SEASON ---------------- */

function endSeason() {
  addLog("🏁 Season finished!");

  game.teams.forEach(t => {
    t.played = 0;
    t.wins = 0;
    t.losses = 0;
    t.points = 0;
  });

  game.week = 1;
}

/* ---------------- UI ---------------- */

function updateUI() {

  if (!game.started) return;

  document.getElementById("name").innerText = game.name;
  document.getElementById("pos").innerText = game.position;

  document.getElementById("age").innerText = game.age.toFixed(1);
  document.getElementById("club").innerText = game.club;
  document.getElementById("money").innerText = game.money;
  document.getElementById("rep").innerText = game.rep;
  document.getElementById("week").innerText = game.week;

  document.getElementById("pace").innerText = game.stats.pace;
  document.getElementById("shoot").innerText = game.stats.shoot;
  document.getElementById("pass").innerText = game.stats.pass;
  document.getElementById("fit").innerText = game.stats.fit;

  let html = "";
  game.teams.forEach(t => {
    html += `<tr>
      <td>${t.name}</td>
      <td>${t.played}</td>
      <td>${t.wins}</td>
      <td>${t.losses}</td>
      <td>${t.points}</td>
    </tr>`;
  });

  document.getElementById("table").innerHTML = html;

  let logHTML = "";
  game.log.forEach(l => logHTML += `<p>${l}</p>`);
  document.getElementById("log").innerHTML = logHTML;
}

/* ---------------- AUTO FIX ON LOAD ---------------- */

window.onload = () => {
  if (game.started) {
    document.getElementById("intro").style.display = "none";
    document.getElementById("game").style.display = "block";
    initLeague();
    updateUI();
  }
};

</script>

</body>
</html>
