<!DOCTYPE html>
<html>
<head>
  <title>Football Career Simulator</title>

  <style>
    body {
      font-family: Arial;
      background: #0b0f1a;
      color: white;
      text-align: center;
      padding: 20px;
    }

    .box {
      max-width: 1100px;
      margin: auto;
      background: #151b2d;
      padding: 20px;
      border-radius: 12px;
    }

    #game { display: none; }

    button {
      padding: 10px;
      margin: 5px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
    }

    .train { background: #00c853; }
    .match { background: #ff9800; }
    .start { background: #00c853; }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .panel {
      background: #1b2440;
      padding: 10px;
      border-radius: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      border: 1px solid #2a355f;
      padding: 6px;
    }

    th {
      background: #111a33;
    }

    #matchFeed {
      text-align: left;
      background: #0b1024;
      padding: 10px;
      border-radius: 10px;
      min-height: 160px;
    }
  </style>
</head>

<body>

<div class="box">

  <!-- INTRO -->
  <div id="intro">
    <h1>⚽ Football Career Simulator</h1>

    <input id="name" placeholder="Your name">
    <br><br>

    <select id="pos">
      <option value="striker">Striker ⚽</option>
      <option value="midfielder">Midfielder 🎮</option>
      <option value="defender">Defender 🛡️</option>
    </select>

    <br><br>
    <button class="start" onclick="startGame()">Start Career</button>
  </div>

  <!-- GAME -->
  <div id="game">

    <h2>👤 Player</h2>
    <p id="playerInfo"></p>

    <div class="grid">

      <div class="panel">
        <h3>📊 Stats</h3>
        <p>PACE: <span id="pace"></span></p>
        <p>SHOOT: <span id="shoot"></span></p>
        <p>PASS: <span id="pass"></span></p>
        <p>FITNESS: <span id="fit"></span></p>

        <button class="train" onclick="train()">Train</button>
      </div>

      <div class="panel">
        <h3>⚽ Match Controls</h3>
        <button class="match" onclick="playMatch()">Play Match</button>
        <p>Fatigue: <span id="fatigue"></span></p>
        <p>Form: <span id="form"></span></p>
      </div>

    </div>

    <h3>📺 Match Feed</h3>
    <div id="matchFeed"></div>

    <h3>🏆 League Table</h3>
    <table>
      <thead>
        <tr>
          <th>Team</th>
          <th>P</th>
          <th>W</th>
          <th>L</th>
          <th>Pts</th>
        </tr>
      </thead>
      <tbody id="table"></tbody>
    </table>

  </div>

</div>

<script>

/* ---------------- GAME ---------------- */

let game = {
  name: "",
  position: "",
  fatigue: 100,
  form: 0,

  stats: {
    pace: 40,
    shoot: 40,
    pass: 40,
    fit: 50
  },

  teams: []
};

/* ---------------- LEAGUE ---------------- */

function initLeague() {
  game.teams = [
    team("Manchester City"),
    team("Arsenal"),
    team("Liverpool"),
    team("Chelsea"),
    team("Manchester United"),
    team("Tottenham"),
    team("Newcastle"),
    team("Aston Villa")
  ];
}

function team(name) {
  return { name, p: 0, w: 0, l: 0, pts: 0 };
}

/* ---------------- START ---------------- */

function startGame() {

  game.name = document.getElementById("name").value;
  game.position = document.getElementById("pos").value;

  if (!game.name) return alert("Enter name");

  if (game.position === "striker") game.stats.shoot += 10;
  if (game.position === "midfielder") game.stats.pass += 10;
  if (game.position === "defender") game.stats.fit += 10;

  initLeague();

  document.getElementById("intro").style.display = "none";
  document.getElementById("game").style.display = "block";

  updateUI();
}

/* ---------------- TRAINING ---------------- */

function train() {

  let stat = ["pace","shoot","pass","fit"][Math.random()*4|0];

  game.stats[stat] += 1 + Math.random()*2;

  game.fatigue -= 10;
  if (game.fatigue < 0) game.fatigue = 0;

  addFeed("🏋️ Training improved " + stat);

  updateUI();
}

/* ---------------- MATCH ENGINE ---------------- */

function playMatch() {

  let opponent = game.teams[Math.random()*game.teams.length|0];

  opponent.p++;
  let you = game.stats;

  let yourPower =
    you.pace + you.shoot + you.pass + you.fit + game.form - (game.fatigue < 40 ? 15 : 0);

  let oppPower = 150 + Math.random()*80;

  let feed = [];

  feed.push("⚽ Kick off vs " + opponent.name);

  let goalsYou = 0;
  let goalsOpp = 0;

  // simulate 5 events
  for (let i=0;i<5;i++) {

    let chance = Math.random()*100;

    if (chance < yourPower/5) {
      goalsYou++;
      feed.push("🔥 GOAL for YOU!");
    }

    if (chance < oppPower/6) {
      goalsOpp++;
      feed.push("💥 Opponent scores!");
    }
  }

  if (goalsYou > goalsOpp) {
    game.form += 2;
    game.stats.fit += 0.5;
    opponent.l++;
    opponent.pts += 0;
    feed.push("🏆 YOU WIN " + goalsYou + "-" + goalsOpp);
  } else {
    game.form -= 2;
    opponent.w++;
    opponent.pts += 3;
    feed.push("😓 YOU LOSE " + goalsYou + "-" + goalsOpp);
  }

  game.form = Math.max(-10, Math.min(10, game.form));

  game.fatigue -= 15;
  if (game.fatigue < 0) game.fatigue = 0;

  document.getElementById("matchFeed").innerHTML = feed.map(f => "<p>"+f+"</p>").join("");

  updateUI();
}

/* ---------------- UI ---------------- */

function updateUI() {

  document.getElementById("playerInfo").innerText =
    game.name + " | " + game.position;

  document.getElementById("pace").innerText = game.stats.pace.toFixed(1);
  document.getElementById("shoot").innerText = game.stats.shoot.toFixed(1);
  document.getElementById("pass").innerText = game.stats.pass.toFixed(1);
  document.getElementById("fit").innerText = game.stats.fit.toFixed(1);

  document.getElementById("fatigue").innerText = game.fatigue;
  document.getElementById("form").innerText = game.form;

  let table = "";

  game.teams.forEach(t => {
    table += `
      <tr>
        <td>${t.name}</td>
        <td>${t.p}</td>
        <td>${t.w}</td>
        <td>${t.l}</td>
        <td>${t.pts}</td>
      </tr>
    `;
  });

  document.getElementById("table").innerHTML = table;
}

/* ---------------- FEED ---------------- */

function addFeed(t) {
  document.getElementById("matchFeed").innerHTML =
    "<p>" + t + "</p>" + document.getElementById("matchFeed").innerHTML;
}

</script>

</body>
</html>
