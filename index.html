<!DOCTYPE html>
<html>
<head>
  <title>Football Career App</title>

  <style>
    body {
      font-family: Arial;
      background: #0b0f1a;
      color: white;
      text-align: center;
      padding: 20px;
    }

    #game { display:none; }

    .box {
      max-width: 1200px;
      margin:auto;
      background:#151b2d;
      padding:20px;
      border-radius:12px;
    }

    button {
      padding:10px;
      margin:5px;
      border-radius:8px;
      border:none;
      cursor:pointer;
    }

    .nav {
      display:flex;
      justify-content:center;
      flex-wrap:wrap;
      margin-bottom:10px;
    }

    .nav button {
      background:#263159;
      color:white;
    }

    .active {
      background:#00c853 !important;
    }

    .start { background:#00c853; }

    .panel {
      background:#1b2440;
      padding:10px;
      border-radius:10px;
      margin-top:10px;
    }

    table {
      width:100%;
      border-collapse:collapse;
    }

    th, td {
      border:1px solid #2a355f;
      padding:6px;
    }

    th { background:#111a33; }

    .hidden { display:none; }

    #feed {
      background:#0b1024;
      padding:10px;
      border-radius:10px;
      min-height:140px;
      text-align:left;
    }
  </style>
</head>

<body>

<div class="box">

  <!-- INTRO -->
  <div id="intro">
    <h1>⚽ Football Career App</h1>

    <input id="name" placeholder="Enter name">
    <br><br>

    <button class="start" onclick="start()">Start Career</button>
  </div>

  <!-- GAME -->
  <div id="game">

    <!-- NAV -->
    <div class="nav">
      <button onclick="showTab('home')">Home</button>
      <button onclick="showTab('player')">Player</button>
      <button onclick="showTab('train')">Train</button>
      <button onclick="showTab('match')">Fixtures</button>
      <button onclick="showTab('league')">League</button>
      <button onclick="showTab('jobs')">Jobs</button>
    </div>

    <!-- HOME -->
    <div id="home" class="tab">
      <h2>🏠 Home</h2>
      <p id="homeInfo"></p>
    </div>

    <!-- PLAYER -->
    <div id="player" class="tab hidden">
      <h2>👤 Player</h2>

      <div class="panel">
        <p>Name: <span id="pname"></span></p>
        <p>Club: <span id="club"></span></p>
        <p>Fatigue: <span id="fatigue"></span></p>
        <p>Form: <span id="form"></span></p>
      </div>

      <div class="panel">
        <p>Pace: <span id="pace"></span></p>
        <p>Shoot: <span id="shoot"></span></p>
        <p>Pass: <span id="pass"></span></p>
        <p>Fit: <span id="fit"></span></p>
      </div>
    </div>

    <!-- TRAIN -->
    <div id="train" class="tab hidden">
      <h2>🏋️ Training</h2>
      <button onclick="train()">Train</button>
      <p>Improves random stat, reduces fatigue</p>
    </div>

    <!-- MATCH -->
    <div id="match" class="tab hidden">
      <h2>⚽ Match Day</h2>
      <button onclick="playMatch()">Play Match</button>

      <h3>📺 Feed</h3>
      <div id="feed"></div>
    </div>

    <!-- LEAGUE -->
    <div id="league" class="tab hidden">
      <h2>🏆 League Table</h2>

      <table>
        <thead>
          <tr>
            <th>Team</th><th>P</th><th>W</th><th>L</th><th>Pts</th>
          </tr>
        </thead>
        <tbody id="table"></tbody>
      </table>
    </div>

    <!-- JOBS -->
    <div id="jobs" class="tab hidden">
      <h2>💼 Transfer Offers</h2>
      <div id="offers"></div>
    </div>

  </div>

</div>

<script>

/* ---------------- STATE ---------------- */

let game = {
  name:"",
  club:"Manchester United",

  fatigue:100,
  form:0,

  offers:[],

  stats:{
    pace:40,
    shoot:40,
    pass:40,
    fit:50
  },

  teams:[]
};

/* ---------------- INIT ---------------- */

function createTeam(n){
  return {name:n,p:0,w:0,l:0,pts:0};
}

function initLeague(){
  game.teams=[
    createTeam("Man City"),
    createTeam("Arsenal"),
    createTeam("Liverpool"),
    createTeam("Chelsea"),
    createTeam("Man United"),
    createTeam("Tottenham"),
    createTeam("Newcastle"),
    createTeam("Aston Villa")
  ];
}

/* ---------------- START ---------------- */

function start(){
  game.name=document.getElementById("name").value;
  if(!game.name) return alert("Enter name");

  initLeague();

  document.getElementById("intro").style.display="none";
  document.getElementById("game").style.display="block";

  showTab("home");
  updateUI();
}

/* ---------------- TABS ---------------- */

function showTab(tab){

  document.querySelectorAll(".tab").forEach(t=>t.classList.add("hidden"));
  document.getElementById(tab).classList.remove("hidden");
}

/* ---------------- TRAIN ---------------- */

function train(){

  let stat=["pace","shoot","pass","fit"][Math.random()*4|0];

  game.stats[stat]+=1+Math.random()*2;
  game.fatigue-=10;

  addFeed("🏋️ Improved "+stat);

  updateUI();
}

/* ---------------- MATCH ---------------- */

function playMatch(){

  let opp=game.teams[Math.random()*game.teams.length|0];

  let power=
    game.stats.pace+
    game.stats.shoot+
    game.stats.pass+
    game.stats.fit+
    game.form-
    (game.fatigue<40?15:0);

  let oppPower=150+Math.random()*80;

  let you=0,them=0;

  let feed=["⚽ vs "+opp.name];

  for(let i=0;i<6;i++){

    let r=Math.random()*100;

    if(r<power/5){you++;feed.push("🔥 GOAL YOU");}
    if(r<oppPower/6){them++;feed.push("💥 GOAL THEM");}
  }

  if(you>them){game.form+=2;opp.w++;opp.pts+=3;feed.push("🏆 WIN "+you+"-"+them);}
  else{game.form-=2;opp.l++;feed.push("😓 LOSS "+you+"-"+them);}

  game.fatigue-=15;

  generateOffers();

  document.getElementById("feed").innerHTML=feed.map(f=>"<p>"+f+"</p>").join("");

  updateUI();
}

/* ---------------- JOBS ---------------- */

function generateOffers(){

  if(Math.random()>0.6){

    let clubs=[
      {name:"Arsenal",wage:200},
      {name:"Liverpool",wage:250},
      {name:"Chelsea",wage:300},
      {name:"Man City",wage:500}
    ];

    game.offers.push(clubs[Math.random()*clubs.length|0]);

    showOffers();
  }
}

function showOffers(){

  let html="";

  game.offers.forEach((o,i)=>{
    html+=`<p>${o.name} - £${o.wage}
    <button onclick="accept(${i})">Accept</button></p>`;
  });

  document.getElementById("offers").innerHTML=html;
}

function accept(i){
  game.club=game.offers[i].name;
  game.offers=[];
  updateUI();
}

/* ---------------- UI ---------------- */

function updateUI(){

  document.getElementById("homeInfo").innerText=
    game.name+" | "+game.club+" | Form: "+game.form;

  document.getElementById("pname").innerText=game.name;
  document.getElementById("club").innerText=game.club;

  document.getElementById("fatigue").innerText=game.fatigue;
  document.getElementById("form").innerText=game.form;

  document.getElementById("pace").innerText=game.stats.pace.toFixed(1);
  document.getElementById("shoot").innerText=game.stats.shoot.toFixed(1);
  document.getElementById("pass").innerText=game.stats.pass.toFixed(1);
  document.getElementById("fit").innerText=game.stats.fit.toFixed(1);

  let t="";
  game.teams.forEach(x=>{
    t+=`<tr><td>${x.name}</td><td>${x.p}</td><td>${x.w}</td><td>${x.l}</td><td>${x.pts}</td></tr>`;
  });

  document.getElementById("table").innerHTML=t;
}

/* ---------------- FEED ---------------- */

function addFeed(t){
  document.getElementById("feed").innerHTML="<p>"+t+"</p>"+document.getElementById("feed").innerHTML;
}

</script>

</body>
</html>
